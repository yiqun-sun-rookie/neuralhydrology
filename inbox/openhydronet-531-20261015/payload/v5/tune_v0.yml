# screening run (train 1999-10..2006-09, held-out window 2006-10..2008-09); ID18 test period not used
experiment_name: tune_v0
run_dir: /data1/home/sunyiq/openhydronet_531_20261015/runs
logging_level: INFO
detect_anomaly: false
print_warnings_once: false
dataset: multimet
train_basin_file: /data1/home/sunyiq/openhydronet_531_20261015/data/id18_basins_531.txt
validation_basin_file: /data1/home/sunyiq/openhydronet_531_20261015/data/id18_basins_531.txt
test_basin_file: /data1/home/sunyiq/openhydronet_531_20261015/data/id18_basins_531.txt
data_dir: /data1/home/sunyiq/openhydronet_531_20261015/data/id18_maurer
train_start_date: 01/10/1999
train_end_date: 30/09/2006
validation_start_date: 01/10/2006
validation_end_date: 30/09/2008
test_start_date: 01/10/2006
test_end_date: 30/09/2008
hindcast_inputs:
  maurer: &id001 [maurer_prcp, maurer_srad, maurer_tmax, maurer_tmin, maurer_vp]
forecast_inputs:
  maurer: *id001
static_attributes: [p_mean, pet_mean, aridity, p_seasonality, frac_snow, high_prec_freq, high_prec_dur, low_prec_freq, low_prec_dur, elev_mean,
  slope_mean, area_gages2, frac_forest, lai_max, lai_diff, gvf_max, gvf_diff, soil_depth_pelletier, soil_depth_statsgo, soil_porosity, soil_conductivity,
  max_water_content, sand_frac, silt_frac, clay_frac, carbonate_rocks_frac, geol_permeability]
target_variables: [streamflow]
model: mean_embedding_forecast_lstm
hidden_size: 512
head: regression
loss: NSE
optimizer: Adam
seq_length: 365
lead_time: 7
forecast_overlap: 365
timestep_counter: true
output_dropout: 0.4
initial_forget_bias: 3
weight_init_opts: [lstm-ih-xavier, lstm-hh-orthogonal, fc-xavier]
statics_embedding:
  type: fc
  hiddens: [100, 100, 20]
  activation: [tanh, tanh, linear]
  dropout: 0.0
hindcast_embedding:
  type: fc
  hiddens: [100, 20]
  activation: [tanh, linear]
  dropout: 0.0
forecast_embedding:
  type: fc
  hiddens: [20, 20, 20, 20]
  activation: [tanh, tanh, tanh, linear]
  dropout: 0.0
device: cuda:0
epochs: 50
batch_size: 512
max_updates_per_epoch: 2000
learning_rate_strategy: StepLR
initial_learning_rate: 0.001
learning_rate_drop_factor: 0.5
learning_rate_epochs_drop: 17
clip_gradient_norm: 1
target_noise_std: 0.005
metrics: [NSE, KGE, Alpha-NSE, Beta-NSE, Beta-KGE, Peak-Timing, Missed-Peaks]
tester_skip_obs_all_nan: true
tester_sample_reduction: mean
clip_targets_to_zero: [streamflow]
predict_last_n: 8
allzero_samples_are_invalid: false
num_workers: 0
log_loss_every_nth_update: 50
log_n_figures: 0
cache: {enabled: false, byte_limit: 2000000000, use_swap_memory: null}
dynamics_data_dir: /data1/home/sunyiq/openhydronet_531_20261015/data/id18_maurer/dynamics
compile: false
output_activation: linear
seed: 11

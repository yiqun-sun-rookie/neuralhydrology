name: nh-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch
  - pytorch-cuda=11.8
  - torchvision
  - torchaudio
  - pandas
  - numpy
  - scipy
  - xarray
  - h5py
  - netcdf4
  - numba
  - tqdm
  - matplotlib
  - ruamel.yaml
  - pip
  - pip:
      - tensorboard
      - -e .

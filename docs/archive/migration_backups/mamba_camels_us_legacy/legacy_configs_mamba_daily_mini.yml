# --- Experiment configurations --------------------------------------------------------------------

# experiment name, used as folder name
experiment_name: mamba_daily_mini

# place to store run directory (if empty runs are stored in $cwd$/runs/)
run_dir:

# files to specify training, validation and test basins
train_basin_file: experiments/camels_us/data/50_basin_list.txt
validation_basin_file: experiments/camels_us/data/50_basin_list.txt
test_basin_file: experiments/camels_us/data/50_basin_list.txt

# training, validation and test time periods (format = 'dd/mm/yyyy')
# Shorter periods for quick testing
train_start_date: '01/10/1999'
train_end_date: '30/09/2001'  # 2 years
validation_start_date: '01/10/1989'
validation_end_date: '30/09/1990' # 1 year
test_start_date: '01/10/1990'
test_end_date: '30/09/1991' # 1 year

seed: 123
device: cuda:0

# --- Validation configuration ---------------------------------------------------------------------

validate_every: 1
validate_n_random_basins: 50
metrics:
- NSE

# --- Model configuration --------------------------------------------------------------------------

model: mamba
head: regression

# Mamba settings
mamba_d_state: 16
mamba_d_conv: 4
mamba_expand: 2
mamba_n_layers: 2

hidden_size: 128
output_dropout: 0.2
output_activation: linear

# --- Training configuration -----------------------------------------------------------------------

optimizer: Adam
loss: NSE
learning_rate:
    0: 1e-3

batch_size: 64  # Reduced for stability
epochs: 2  # Quick test
clip_gradient_norm: 1
predict_last_n: 1
seq_length: 365
num_workers: 0
log_interval: 5
log_tensorboard: True
save_weights_every: 1
save_validation_results: True

# --- Data configurations --------------------------------------------------------------------------

dataset: camels_us
data_dir: data/CAMELS_US
forcings:
- daymet
dynamic_inputs:
- prcp(mm/day)
- srad(W/m2)
- tmax(C)
- tmin(C)
- vp(Pa)
target_variables:
- QObs(mm/d)
static_attributes:
- elev_mean
- slope_mean
- area_gages2
- frac_forest
- lai_max
- lai_diff
- gvf_max
- gvf_diff
- soil_depth_pelletier
- soil_depth_statsgo
- soil_porosity
- soil_conductivity
- max_water_content
- sand_frac
- silt_frac
- clay_frac
- carbonate_rocks_frac
- geol_permeability
- p_mean
- pet_mean
- aridity
- frac_snow
- high_prec_freq
- high_prec_dur
- low_prec_freq
- low_prec_dur

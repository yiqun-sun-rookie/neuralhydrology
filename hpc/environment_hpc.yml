name: neuralhydrology
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.11
  
  # PyTorch (CUDA 12.1)
  - pytorch=2.4.0
  - torchvision=0.19.0
  - torchaudio=2.4.0
  - pytorch-cuda=12.1
  
  # Data Processing
  - numpy>=1.26
  - pandas
  - xarray
  - netcdf4
  - h5py
  - scipy
  - numba
  
  # Utilities
  - ruamel.yaml
  - tqdm
  - tensorboard
  - matplotlib
  - seaborn
  
  # Tools
  - pip

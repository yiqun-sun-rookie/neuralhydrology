# F4_Upstream_AR_Static.yml: Upstream rain gauges only + autoregression + static attributes
# Upstream 4 stations: mengwu, banteng, aka, kuwei
# UPDATE 2025-11-29: Added custom_normalization to preserve zero point for rain/flow

experiment_name: F4_Upstream_AR_Static
run_dir: results/04_namou_kuwei

dataset: generic
data_dir: data/namou_kuwei/hourly
train_basin_file: data/namou_kuwei/hourly/train_basins.txt
validation_basin_file: data/namou_kuwei/hourly/validation_basins.txt
test_basin_file: data/namou_kuwei/hourly/test_basins.txt

# ========== TIME SPLIT (NO LEAKAGE) ==========
# Train: 2020 (1 year)
# Val: 2021 (1 year, independent)
# Test: 2022 (1 year, independent)
# Note: p_mengwu has no data in 2023
train_start_date: "01/01/2020"
train_end_date: "31/12/2020"
validation_start_date: "01/01/2021"
validation_end_date: "31/12/2021"
test_start_date: "01/01/2022"
test_end_date: "31/12/2022"

model: cudalstm
head: regression
hidden_size: 64
initial_forget_bias: 3

optimizer: Adam
loss: NSE
learning_rate:
  0: 0.001
  30: 0.0005
  60: 0.0001
batch_size: 256
epochs: 60
clip_gradient_norm: 1.0
validate_every: 5
validate_n_random_basins: 1
save_weights_every: 5
seed: 2025
device: cpu

seq_length: 168
predict_last_n: 1

# Only upstream 4 rain gauges
dynamic_inputs:
  - p_aka
  - p_banteng
  - p_kuwei
  - p_mengwu
  - qobs

# Custom normalization: preserve zero point for rain/flow
custom_normalization:
  p_aka: {centering: none, scaling: std}
  p_banteng: {centering: none, scaling: std}
  p_kuwei: {centering: none, scaling: std}
  p_mengwu: {centering: none, scaling: std}
  qobs: {centering: none, scaling: std}

static_attributes:
  - area
  - elev_mean
  - slope_mean

target_variables:
  - qobs

metrics:
  - NSE
  - KGE
  - RMSE
  - Peak-MAPE


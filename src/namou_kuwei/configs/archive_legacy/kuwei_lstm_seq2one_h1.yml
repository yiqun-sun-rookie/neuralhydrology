# [DEPRECATED] NeuralHydrology Configuration for Nam Ou Kuwei (Seq-to-One / Multi-Horizon)
# WARNING: This config uses old variable names (q_kuwei, p_kuwei_rain, etc.)
# that are NOT compatible with current data format. Use hierarchy/S4*.yml instead.
# -------------------------------------------------------------------------
# Experiment: LSTM, Forecast Horizon=1 (Baseline)
# Inputs: Rain (all upstream/nearby stations) + Past Discharge (Autoregression)
# Target: Kuwei Discharge (q_kuwei)

# --- General ---
experiment_name: kuwei_lstm_seq2one_h1
run_dir: experiments/namou_kuwei/runs
train_basin_file: data/namou_kuwei/hourly/basins.txt
validation_basin_file: data/namou_kuwei/hourly/basins.txt
test_basin_file: data/namou_kuwei/hourly/basins.txt
data_dir: data/namou_kuwei/hourly

# --- Model ---
model: cudalstm
head: regression
hidden_size: 64
initial_forget_bias: 3
output_activation: linear
output_dropout: 0.4

# --- Training ---
optimizer: Adam
loss: NSE
learning_rate:
  0: 1e-3
  10: 5e-4
  20: 1e-4
batch_size: 256
epochs: 30
clip_gradient_norm: 1
predict_last_n: 1  # Seq-to-One: only predict the last time step
seq_length: 72     # Lookback window: 72 hours (3 days)
num_workers: 0     # Windows issues with multiprocessing
log_interval: 5
log_tensorboard: true
save_weights_every: 1

# --- Data ---
dataset: generic
time_series_file: time_series/namou_kuwei.csv
static_attributes_file: attributes.csv
target_variables:
  - q_kuwei

# Dynamic inputs (forcing + past targets)
dynamic_inputs:
  - p_mengwu
  - p_banteng
  - p_aka
  - p_kuwei_rain
  - p_banpo
  - p_bandang
  - p_xiaolishu
  - p_xinzai
  - q_kuwei  # Autoregression: use past observed flow

# Static inputs
static_attributes:
  - area_km2

# --- Validation/Test ---
# Metrics
metrics:
  - NSE
  - KGE
  - RMSE
  - Alpha-NSE
  - Beta-NSE

# Time ranges (Hourly data: 2020-01-01 to 2024-12-31)
# Train: 2020-2022 (3 years)
# Val:   2023 (1 year)
# Test:  2024 (1 year)
train_start_date: "2020-01-01 00:00:00"
train_end_date: "2022-12-31 23:00:00"
validation_start_date: "2023-01-01 00:00:00"
validation_end_date: "2023-12-31 23:00:00"
test_start_date: "2024-01-01 00:00:00"
test_end_date: "2024-12-31 23:00:00"

# --- Visualization ---
# Disable validation plots during training to save time
log_n_figures: 0


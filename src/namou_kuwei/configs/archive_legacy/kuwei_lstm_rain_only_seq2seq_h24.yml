# [DEPRECATED] NeuralHydrology Configuration for Nam Ou Kuwei (Seq-to-Seq / Multi-Step)
# WARNING: This config uses old variable names (q_kuwei, p_kuwei_rain, etc.)
# that are NOT compatible with current data format. Use hierarchy/S4*.yml instead.
# -------------------------------------------------------------------------
# Experiment: LSTM (MTS-LSTM style or simple LSTM with predict_last_n), Forecast Horizon=24
# Inputs: Rain (all upstream/nearby stations) + Past Discharge (Autoregression)
# Target: Kuwei Discharge (q_kuwei)
# Note: NH 'cudalstm' with predict_last_n > 1 works as a Seq-to-Seq for the overlap part,
#       but strictly speaking it predicts N steps *given known inputs* for those N steps.
#       Since we have rain forecasts (or assume perfect rain foresight), this is valid.
#       However, we CANNOT use q_kuwei (autoregression) for the future steps in dynamic_inputs 
#       unless we accept it uses ground truth (teacher forcing) or we use a custom autoregressive model.
#       
#       Standard NH LSTM usage with future rain but NO future flow:
#       Usually implies training a model that predicts t+1 given t..t-k.
#       To predict t+24, we typically run it recursively (not supported natively in standard training loop) 
#       OR we train a separate model for horizon=24 (direct strategy).
#
#       Here, we configure a "Direct Strategy" for Horizon=24 (predict t+24 given inputs up to t+24).
#       BUT wait: if we include q_kuwei in dynamic_inputs, it will use q_kuwei at t+24 to predict q_kuwei at t+24 (leakage).
#       Correct approach for Direct Horizon=H in NH:
#       Shift the target by -H steps (or shift inputs by +H). 
#       NH has a 'lagged_features' mechanism but it's complex.
#       
#       Alternative: Use 'MTS-LSTM' or 'Encoder-Decoder' if supported. 
#       Let's stick to a simpler 'Seq2Seq' approximation: 
#       Train to predict the last 24 hours of the sequence.
#       BUT we must be careful: if q_kuwei is in inputs, it must NOT be future q_kuwei.
#
#       Let's use a simple "Direct Strategy" for this config:
#       We predict Q(t) using Inputs(t-24...t).
#       Wait, we want to use Rain(t) but NOT Q(t).
#       NH doesn't easily support "mixed availability" in a single input vector.
#       
#       BETTER PLAN for Seq2Seq in NH standard:
#       Use `head: regression` and `predict_last_n: 24`.
#       AND REMOVE `q_kuwei` from dynamic_inputs for this specific experiment to avoid leakage,
#       OR rely on the fact that for Q(t), we only have Q(t-1) if we shift properly?
#       Actually, let's try the robust baseline first:
#       Seq-to-One with lag. 
#       
#       For now, I will provide a config that is "Seq-to-One" but targeted at Horizon=24.
#       (i.e. Input[t-72...t] -> Output[t+24]). 
#       This requires us to SHIFT the target in the dataframe or use 'target_noise' trick?
#       No, NH handles dataset indexing. 
#       
#       Let's write a "Rain-Only Seq2Seq" config. 
#       Inputs: Rain only (available in future).
#       Outputs: Q (predict last 24 steps).
#       This is valid.

experiment_name: kuwei_lstm_rain_only_seq2seq_h24
run_dir: experiments/namou_kuwei/runs
train_basin_file: data/namou_kuwei/hourly/basins.txt
validation_basin_file: data/namou_kuwei/hourly/basins.txt
test_basin_file: data/namou_kuwei/hourly/basins.txt
data_dir: data/namou_kuwei/hourly

model: cudalstm
head: regression
hidden_size: 64
initial_forget_bias: 3
output_activation: linear
output_dropout: 0.4

optimizer: Adam
loss: NSE
learning_rate:
  0: 1e-3
  10: 5e-4
  20: 1e-4
batch_size: 256
epochs: 30
clip_gradient_norm: 1

# Key difference: Predict last 24 steps of the sequence
predict_last_n: 24 
seq_length: 96     # 72h history + 24h future context (if using future rain)
                   # Actually, for 'predict_last_n: 24', the model outputs y[t-23]...y[t].
                   # To act as a forecast, we feed it rain[t-96...t]. 
                   # It predicts Q[t-23...t]. 
                   # This is essentially a simulation mode. 
                   # To get a Forecast, we just shift the evaluation time window.

num_workers: 0
log_interval: 5
log_tensorboard: true
save_weights_every: 1

dataset: generic
time_series_file: time_series/namou_kuwei.csv
static_attributes_file: attributes.csv
target_variables:
  - q_kuwei

dynamic_inputs:
  # Rain ONLY (can be known in "future" via forecast)
  - p_mengwu
  - p_banteng
  - p_aka
  - p_kuwei_rain
  - p_banpo
  - p_bandang
  - p_xiaolishu
  - p_xinzai
  # NO q_kuwei here, to allow multi-step prediction without autoregression leakage
  # (Unless we implemented teacher forcing, which cudalstm doesn't do for inference)

static_attributes:
  - area_km2

metrics:
  - NSE
  - KGE
  - RMSE
  - Alpha-NSE
  - Beta-NSE

train_start_date: "2020-01-01 00:00:00"
train_end_date: "2022-12-31 23:00:00"
validation_start_date: "2023-01-01 00:00:00"
validation_end_date: "2023-12-31 23:00:00"
test_start_date: "2024-01-01 00:00:00"
test_end_date: "2024-12-31 23:00:00"

log_n_figures: 0


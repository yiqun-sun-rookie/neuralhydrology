# S4_LT1h.yml: Lead Time = 1 hour (baseline)
# Based on S4_Rain_AR_Static_v4 with NO DATA LEAKAGE

experiment_name: S4_LT1h_v4
run_dir: results/04_namou_kuwei

dataset: generic
data_dir: data/namou_kuwei/hourly
train_basin_file: data/namou_kuwei/hourly/train_basins.txt
validation_basin_file: data/namou_kuwei/hourly/validation_basins.txt
test_basin_file: data/namou_kuwei/hourly/test_basins.txt

# TIME SPLIT (NO LEAKAGE - verified by config_validator.py)
train_start_date: "01/01/2020"
train_end_date: "31/12/2020"
validation_start_date: "01/01/2021"
validation_end_date: "31/12/2021"
test_start_date: "01/01/2022"
test_end_date: "31/12/2022"

model: cudalstm
head: regression
hidden_size: 64
initial_forget_bias: 3

optimizer: Adam
loss: NSE
learning_rate:
  0: 0.001
  30: 0.0005
  60: 0.0001
batch_size: 256
epochs: 60
clip_gradient_norm: 1.0
validate_every: 5
validate_n_random_basins: 1
save_weights_every: 10
seed: 2025
device: cpu

seq_length: 168
predict_last_n: 1  # 1 hour lead time

dynamic_inputs:
  - p_aka
  - p_bandang
  - p_banpozai
  - p_banteng
  - p_kuwei
  - p_mengwu
  - p_xiaolishu
  - p_xinzai
  - qobs

custom_normalization:
  p_aka: {centering: none, scaling: std}
  p_bandang: {centering: none, scaling: std}
  p_banpozai: {centering: none, scaling: std}
  p_banteng: {centering: none, scaling: std}
  p_kuwei: {centering: none, scaling: std}
  p_mengwu: {centering: none, scaling: std}
  p_xiaolishu: {centering: none, scaling: std}
  p_xinzai: {centering: none, scaling: std}
  qobs: {centering: none, scaling: std}

static_attributes:
  - area
  - elev_mean
  - slope_mean

target_variables:
  - qobs

metrics:
  - NSE
  - KGE
  - RMSE
  - Peak-MAPE



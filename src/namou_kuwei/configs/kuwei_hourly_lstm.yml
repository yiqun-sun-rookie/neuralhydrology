# NeuralHydrology Config for Nam Ou Kuwei Station (Hourly)
# Baseline: LSTM, Rain-only + Autoregressive Flow

# --- Experiment Settings ---
experiment_name: kuwei_hourly_lstm_baseline
run_dir: results/04_namou_kuwei
train_basin_file: basins.txt
validation_basin_file: basins.txt
test_basin_file: basins.txt
basics:
  logging_level: INFO

# --- Data Settings ---
data_dir: data/namou_kuwei_hourly
dataset: custom
time_step: 1h

# Features
dynamic_inputs:
  - p_mengwu
  - p_banteng
  - p_aka
  - p_kuwei
  # Autoregressive flow (past observed flow)
  - qobs

target_variables:
  - qobs

static_attributes:
  - area
  - elev_mean
  - slope_mean

# --- Time Ranges ---
# NH 默认读取格式为 %d/%m/%Y，若带小时需看 CustomDataset 怎么解析
# 但 Config 校验时可能强制要求日
train_start_date: "01/01/2020"
train_end_date: "31/12/2022"
validation_start_date: "01/01/2023"
validation_end_date: "31/12/2023"
test_start_date: "01/01/2024"
test_end_date: "31/12/2024"

# --- Model Settings ---
model: cudalstm
head: regression
hidden_size: 64
initial_forget_bias: 3
output_dropout: 0.4
output_activation: linear

# Sequence Settings
seq_length: 168  # 7 days history
predict_last_n: 1 # Forecast next 1 hour (Seq-to-One)

# --- Training Settings ---
optimizer: Adam
loss: NSE
learning_rate:
  0: 1e-3
  30: 5e-4
  60: 1e-4
batch_size: 256
epochs: 80
clip_gradient_norm: 1
validate_every: 3
validate_n_random_basins: 1
save_weights_every: 1

# --- Metrics ---
metrics:
  - NSE
  - KGE
  - RMSE
  - FHV  # Flow Volume Error

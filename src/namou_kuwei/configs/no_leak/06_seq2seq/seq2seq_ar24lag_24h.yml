# Level 6: Seq-to-Seq Experiments  
# Approach C: AR-based Seq2Seq with 24h lag (guaranteed no leakage)
#
# Uses qobs_shift24 as AR input, so when predicting hour 1-24,
# AR input is always from 24+ hours ago (observed data only)
# This is the most conservative no-leakage design

experiment_name: L6_Seq2Seq_AR24lag_24h
run_dir: results/04_namou_kuwei

data_dir: data/namou_kuwei_hourly
dataset: generic
train_basin_file: F:/github/pycharm/projects/neuralhydrology/data/namou_kuwei_hourly/train_basins.txt
validation_basin_file: F:/github/pycharm/projects/neuralhydrology/data/namou_kuwei_hourly/validation_basins.txt
test_basin_file: F:/github/pycharm/projects/neuralhydrology/data/namou_kuwei_hourly/test_basins.txt

train_start_date: "01/01/2020"
train_end_date: "30/06/2021"
validation_start_date: "01/07/2021"
validation_end_date: "31/12/2021"
test_start_date: "01/01/2022"
test_end_date: "31/12/2022"

dynamic_inputs:
  - p_aka
  - p_bandang
  - p_banpozai
  - p_banteng
  - p_kuwei
  - p_mengwu
  - p_xiaolishu
  - p_xinzai

# AR???????24?????
# ???????24?????AR?????????
lagged_features:
  qobs: [24]

autoregressive_inputs:
  - qobs_shift24

target_variables:
  - qobs

model: arlstm
head: regression
hidden_size: 128
initial_forget_bias: 3
seq_length: 192
predict_last_n: 24

optimizer: Adam
loss: NSE
learning_rate:
  0: 0.001
  30: 0.0005
  60: 0.0001
batch_size: 256
epochs: 60
clip_gradient_norm: 1.0
validate_every: 5
save_weights_every: 5
seed: 2025
device: cpu

custom_normalization:
  p_aka: {centering: none, scaling: std}
  p_bandang: {centering: none, scaling: std}
  p_banpozai: {centering: none, scaling: std}
  p_banteng: {centering: none, scaling: std}
  p_kuwei: {centering: none, scaling: std}
  p_mengwu: {centering: none, scaling: std}
  p_xiaolishu: {centering: none, scaling: std}
  p_xinzai: {centering: none, scaling: std}
  qobs: {centering: none, scaling: std}

metrics:
  - NSE
  - KGE
  - RMSE
  - Peak-MAPE

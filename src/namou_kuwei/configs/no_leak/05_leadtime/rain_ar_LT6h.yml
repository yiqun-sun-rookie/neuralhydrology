# Level 5: Lead Time Experiments - LT6h (Rain + AR)
# Forecast horizon: 6 hours
# Rain: Up to time t | Flow: Up to time t-6

experiment_name: L5_Rain_AR_LT6h
run_dir: results/04_namou_kuwei

data_dir: data/namou_kuwei_hourly
dataset: generic
train_basin_file: data/namou_kuwei_hourly/train_basins.txt
validation_basin_file: data/namou_kuwei_hourly/validation_basins.txt
test_basin_file: data/namou_kuwei_hourly/test_basins.txt

train_start_date: "01/01/2020"
train_end_date: "30/06/2021"
validation_start_date: "01/07/2021"
validation_end_date: "31/12/2021"
test_start_date: "01/01/2022"
test_end_date: "31/12/2022"

dynamic_inputs:
  - p_aka
  - p_bandang
  - p_banpozai
  - p_banteng
  - p_kuwei
  - p_mengwu
  - p_xiaolishu
  - p_xinzai

lagged_features:
  qobs: [6]

autoregressive_inputs:
  - qobs_shift6

target_variables:
  - qobs

model: arlstm
head: regression
hidden_size: 64
initial_forget_bias: 3
seq_length: 168
predict_last_n: 1

optimizer: Adam
loss: NSE
learning_rate:
  0: 0.001
  30: 0.0005
  60: 0.0001
batch_size: 256
epochs: 60
clip_gradient_norm: 1.0
validate_every: 5
save_weights_every: 5
seed: 2025
device: cpu

custom_normalization:
  p_aka: {centering: none, scaling: std}
  p_bandang: {centering: none, scaling: std}
  p_banpozai: {centering: none, scaling: std}
  p_banteng: {centering: none, scaling: std}
  p_kuwei: {centering: none, scaling: std}
  p_mengwu: {centering: none, scaling: std}
  p_xiaolishu: {centering: none, scaling: std}
  p_xinzai: {centering: none, scaling: std}
  qobs: {centering: none, scaling: std}

metrics:
  - NSE
  - KGE
  - RMSE
  - Peak-MAPE

# ID 03 smoke test: 2 basins, 1 epoch, CPU
experiment_name: camelsh_lstm_smoke_2basins_ep1

dataset: generic
data_dir: data/camelsh

train_basin_file: src/mamba_camelsh/data/smoke_2_basins.txt
validation_basin_file: src/mamba_camelsh/data/smoke_2_basins.txt
test_basin_file: src/mamba_camelsh/data/smoke_2_basins.txt

train_start_date: "01/01/2010"
train_end_date: "31/12/2012"
validation_start_date: "01/01/2013"
validation_end_date: "31/12/2014"
test_start_date: "01/01/2015"
test_end_date: "31/12/2016"

model: cudalstm
head: regression
hidden_size: 64
initial_forget_bias: 3
output_dropout: 0.1
output_activation: linear

epochs: 1
batch_size: 32
optimizer: AdamW
loss: NSE
learning_rate:
  0: 0.001

dynamic_inputs:
  - Rainf
  - Tair
  - SWdown
  - LWdown
  - Qair
  - PSurf
  - Wind_E
  - Wind_N
  - PotEvap

static_attributes:
  - elev_mean
  - slope_mean
  - area
  - clay_frac
  - sand_frac
  - soil_porosity
  - permeability
  - frac_forest
  - p_mean
  - pet_mean
  - aridity
  - frac_snow
  - high_prec_freq

target_variables:
  - Streamflow

seq_length: 72
predict_last_n: 1

num_workers: 0
validate_every: 1
validate_n_random_basins: 2
clip_gradient_norm: 1.0
log_interval: 1
log_tensorboard: false
save_weights_every: 1
metrics:
  - NSE
  - KGE
seed: 123
device: cpu

run_dir: results/03_mamba_camelsh

# CAMELSH Hourly Mamba - State Space Model Configuration
# Novel: First large-scale hourly hydrological modeling with Mamba SSM
# Baseline comparison: camelsh_hourly_optimized.yml (LSTM)

experiment_name: camelsh_mamba

# Dataset (same as LSTM baseline)
dataset: generic
data_dir: data/camelsh

# Basin files (same as LSTM baseline)
train_basin_file: data/camelsh/available_basins.txt
validation_basin_file: data/camelsh/available_basins.txt
test_basin_file: data/camelsh/available_basins.txt

# Time periods (same as LSTM baseline for fair comparison)
train_start_date: "01/01/2010"
train_end_date: "31/12/2014"
validation_start_date: "01/01/2015"
validation_end_date: "31/12/2017"
test_start_date: "01/01/2018"
test_end_date: "31/12/2020"

# ============================================
# Model configuration - MAMBA SSM
# ============================================
model: mamba
head: regression
hidden_size: 128           # d_model: same as LSTM for fair comparison
output_dropout: 0.1        # Slightly higher dropout for regularization
output_activation: linear

# Mamba-specific hyperparameters
mamba_d_state: 16          # SSM state dimension (default)
mamba_d_conv: 4            # Local convolution width (default)
mamba_expand: 2            # Block expansion factor (default)
mamba_n_layers: 2          # Number of Mamba layers (HuggingFace backend)

# ============================================
# Training configuration
# ============================================
epochs: 30
batch_size: 256            # Same as LSTM baseline
optimizer: AdamW
loss: NSE

# Learning rate schedule (same as LSTM baseline)
learning_rate:
  0: 0.003
  10: 0.001
  20: 0.0005

# ============================================
# Dynamic inputs - NLDAS-2 hourly forcing
# ============================================
dynamic_inputs:
  - Rainf        # Precipitation [kg/m2/s]
  - Tair         # Air temperature [K]
  - SWdown       # Shortwave radiation [W/m2]
  - LWdown       # Longwave radiation [W/m2]
  - Qair         # Specific humidity [kg/kg]
  - PSurf        # Surface pressure [Pa]
  - Wind_E       # Eastward wind [m/s]
  - Wind_N       # Northward wind [m/s]
  - PotEvap      # Potential evaporation [W/m2]

# ============================================
# Static attributes (13 attributes)
# ============================================
static_attributes:
  # Topography
  - elev_mean
  - slope_mean
  - area
  # Soil
  - clay_frac
  - sand_frac
  - soil_porosity
  - permeability
  # Vegetation
  - frac_forest
  # Climate
  - p_mean
  - pet_mean
  - aridity
  - frac_snow
  - high_prec_freq

# Target
target_variables:
  - Streamflow

# ============================================
# Sequence length - KEY ADVANTAGE OF MAMBA
# ============================================
# Mamba has O(N) complexity, can handle longer sequences than LSTM/Transformer
# 336 hours = 14 days (vs 168 hours for LSTM)
seq_length: 336
predict_last_n: 1

# ============================================
# Training parameters
# ============================================
num_workers: 0
validate_every: 2
validate_n_random_basins: 50
clip_gradient_norm: 1.0

# Logging
log_interval: 50
log_tensorboard: true
log_n_figures: 3
save_weights_every: 5

# Metrics
metrics:
  - NSE
  - KGE

# Random seed
seed: 159193

# Device
device: cuda:0


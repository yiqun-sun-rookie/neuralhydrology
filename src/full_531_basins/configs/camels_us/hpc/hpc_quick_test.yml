# HPC快速测试配置
# 用于验证HPC环境配置和快速测试
# 生成时间: 2025-01-XX
# 配置版本: v1.0

# =============================================================================
# 基础设置
# =============================================================================
experiment_name: hpc_quick_test
dataset: camels_us
data_dir: /data/neuralhydrology/CAMELS_US

# =============================================================================
# 模型配置 - 快速测试版本
# =============================================================================
model: cudalstm
head: regression
hidden_size: 128                    # 使用较小的模型进行快速测试
initial_forget_bias: 3
output_dropout: 0.3
output_activation: linear

# =============================================================================
# 训练配置 - 快速测试
# =============================================================================
epochs: 5                           # 仅训练5个epoch进行快速验证
batch_size: 256                     # 适中的批次大小
optimizer: AdamW
loss: NSE

# =============================================================================
# 学习率配置 - 简化版本
# =============================================================================
learning_rate: 0.001                # 固定学习率

# =============================================================================
# 数据配置 - 使用小规模数据集
# =============================================================================
# 使用1个流域进行快速测试
train_basin_file: src/full_531_basins/configs/camels_us/data_splits/1_basin.txt
validation_basin_file: src/full_531_basins/configs/camels_us/data_splits/1_basin.txt
test_basin_file: src/full_531_basins/configs/camels_us/data_splits/1_basin.txt

# 短时间范围
train_start_date: 01/10/1980
train_end_date: 30/09/1985
validation_start_date: 01/10/1985
validation_end_date: 30/09/1987
test_start_date: 01/10/1987
test_end_date: 30/09/1989

# =============================================================================
# 输入特征配置
# =============================================================================
forcings:
  - daymet

dynamic_inputs:
  - prcp(mm/day)
  - srad(W/m2)
  - tmax(C)
  - tmin(C)
  - vp(Pa)

target_variables:
  - QObs(mm/d)

clip_targets_to_zero:
  - QObs(mm/d)

# =============================================================================
# 训练参数 - 快速测试优化
# =============================================================================
seq_length: 365
predict_last_n: 1
num_workers: 4                      # 减少工作进程数
validate_every: 1                   # 每个epoch都验证
validate_n_random_basins: 1         # 仅验证1个流域

# =============================================================================
# 正则化配置
# =============================================================================
clip_gradient_norm: 1.0

# =============================================================================
# 日志和保存配置 - 快速测试
# =============================================================================
log_interval: 1                     # 每个epoch都记录日志
log_tensorboard: true
log_n_figures: 1
save_weights_every: 1               # 每个epoch都保存

verbose: 2                          # 详细输出

# =============================================================================
# 评估指标
# =============================================================================
metrics:
  - NSE
  - RMSE

# =============================================================================
# 随机种子
# =============================================================================
seed: 159193

# =============================================================================
# HPC特定配置 - 简化版本
# =============================================================================
# 禁用一些高级功能以加快测试
use_mixed_precision: false          # 禁用混合精度以简化测试
pin_memory: true
persistent_workers: false           # 禁用持久化workers
prefetch_factor: 2

# 单GPU配置
use_data_parallel: false
gpu_ids: [0]

# 检查点配置
save_best_model: true
early_stopping_patience: 5

# 性能监控
profile_training: false
monitor_gpu_memory: true

# =============================================================================
# 数据加载优化 - 简化版本
# =============================================================================
cache_dataset: false
cache_size: 100
preprocess_workers: 2
data_loading_timeout: 60

# =============================================================================
# 错误处理和恢复 - 简化版本
# =============================================================================
auto_resume: false                  # 快速测试不需要自动恢复
resume_from_latest: false
max_retries: 1

checkpoint_interval: 1
keep_checkpoints: 2

# =============================================================================
# 实验跟踪配置 - 简化版本
# =============================================================================
experiment_tracking: false          # 快速测试不需要详细跟踪
track_hyperparameters: false
track_metrics: false
track_artifacts: false

# 输出目录配置
output_dir: /data/neuralhydrology/runs/quick_test
log_dir: /data/neuralhydrology/logs/quick_test
checkpoint_dir: /data/neuralhydrology/checkpoints/quick_test

# =============================================================================
# 注释和说明
# =============================================================================
# 此配置文件用于HPC环境的快速测试和验证：
# 1. 使用小规模数据集（1个流域）
# 2. 短时间训练（5个epoch）
# 3. 简化模型配置
# 4. 禁用高级功能以加快测试
# 5. 详细日志输出便于调试
#
# 使用场景：
# - HPC环境配置验证
# - 快速功能测试
# - 调试和问题排查
# - 新用户入门测试
#
# 预期运行时间：5-10分钟




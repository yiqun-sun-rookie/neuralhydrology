# Transformer model configuration - 531 basins temporal split
experiment_name: full_531_transformer_ep30

dataset: camels_us
data_dir: data/CAMELS_US

model: transformer
head: regression
hidden_size: 64
output_dropout: 0.0
output_activation: linear

transformer_nheads: 4
transformer_nlayers: 2
transformer_dim_feedforward: 256
transformer_dropout: 0.1
transformer_positional_encoding_type: sum
transformer_positional_dropout: 0.1

statics_embedding:
  type: fc
  hiddens: [32]
  activation: tanh
  dropout: 0.0
dynamics_embedding:
  type: fc
  hiddens: [32]
  activation: tanh
  dropout: 0.0

epochs: 30
batch_size: 256
optimizer: AdamW
loss: NSE
learning_rate:
  0: 0.001
  10: 0.0005
  20: 0.0002

train_basin_file: src/full_531_basins/data/531_basin_list.txt
validation_basin_file: src/full_531_basins/data/531_basin_list.txt
test_basin_file: src/full_531_basins/data/531_basin_list.txt

train_start_date: "01/10/1990"
train_end_date: "30/09/1995"
validation_start_date: "01/10/1995"
validation_end_date: "30/09/2000"
test_start_date: "01/10/2000"
test_end_date: "30/09/2005"

forcings:
  - daymet
dynamic_inputs:
  - prcp(mm/day)
  - srad(W/m2)
  - tmax(C)
  - tmin(C)
  - vp(Pa)

static_attributes:
  - elev_mean
  - slope_mean
  - area_gages2
  - soil_depth_pelletier
  - soil_porosity
  - sand_frac
  - clay_frac
  - frac_forest
  - lai_max
  - gvf_max
  - p_mean
  - aridity
  - frac_snow
  - high_prec_freq

target_variables:
  - QObs(mm/d)
clip_targets_to_zero:
  - QObs(mm/d)

seq_length: 365
predict_last_n: 1

num_workers: 0
validate_every: 2
validate_n_random_basins: 50
clip_gradient_norm: 1.0

log_interval: 10
log_tensorboard: False
log_n_figures: 0
save_weights_every: 10
metrics:
  - NSE


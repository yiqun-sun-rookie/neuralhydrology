# Source pretrain config for knowledge separation experiment.
# Based on reproduce_531_nse074 — CudaLSTM, 531 basins, Kratzert 2019 split.
experiment_name: ks_source_pretrain

dataset: camels_us
data_dir: data/camels_us/full

train_basin_file: examples/06-Finetuning/531_basin_list.txt
validation_basin_file: examples/06-Finetuning/531_basin_list.txt
test_basin_file: examples/06-Finetuning/531_basin_list.txt

train_start_date: 01/10/1999
train_end_date: 30/09/2008
validation_start_date: 01/10/1980
validation_end_date: 30/09/1989
test_start_date: 01/10/1989
test_end_date: 30/09/1999

model: cudalstm
head: regression
hidden_size: 128
initial_forget_bias: 3
output_dropout: 0.0
output_activation: linear

epochs: 30
batch_size: 256
optimizer: AdamW
loss: NSE
learning_rate:
  0: 0.003
  10: 0.001
  20: 0.0005
clip_gradient_norm: 1.0

forcings:
  - daymet
dynamic_inputs:
  - prcp(mm/day)
  - srad(W/m2)
  - tmax(C)
  - tmin(C)
  - vp(Pa)

static_attributes:
  - elev_mean
  - slope_mean
  - area_gages2
  - soil_depth_pelletier
  - soil_porosity
  - sand_frac
  - clay_frac
  - frac_forest
  - lai_max
  - gvf_max
  - p_mean
  - aridity
  - frac_snow
  - high_prec_freq

target_variables:
  - QObs(mm/d)
clip_targets_to_zero:
  - QObs(mm/d)

seq_length: 365
predict_last_n: 1
num_workers: 0
validate_every: 2
validate_n_random_basins: 50
save_weights_every: 5
log_interval: 10
log_tensorboard: false
log_n_figures: 0

metrics:
  - NSE

seed: 159193

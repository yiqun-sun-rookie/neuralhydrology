# ID 02 smoke test: 10 basins, 3 epochs, CPU
experiment_name: mamba_daily_smoke_10basins_ep3

run_dir: results/02_mamba_camels_us

train_basin_file: src/mamba_camels_us/data/smoke_10_basins.txt
validation_basin_file: src/mamba_camels_us/data/smoke_10_basins.txt
test_basin_file: src/mamba_camels_us/data/smoke_10_basins.txt

train_start_date: "01/10/2005"
train_end_date: "30/09/2006"
validation_start_date: "01/10/2004"
validation_end_date: "30/09/2005"
test_start_date: "01/10/2003"
test_end_date: "30/09/2004"

seed: 123
device: cpu

validate_every: 1
validate_n_random_basins: 10
metrics:
  - NSE
  - KGE

model: mamba
head: regression
mamba_d_state: 16
mamba_d_conv: 4
mamba_expand: 2
mamba_n_layers: 2

hidden_size: 64
output_dropout: 0.1
output_activation: linear

optimizer: Adam
loss: NSE
learning_rate:
  0: 1e-3

batch_size: 32
epochs: 3
clip_gradient_norm: 1
predict_last_n: 1
seq_length: 30
num_workers: 0
log_interval: 1
log_tensorboard: false
save_weights_every: 1
save_validation_results: true

dataset: camels_us
data_dir: data/CAMELS_US
forcings:
  - daymet
dynamic_inputs:
  - prcp(mm/day)
  - srad(W/m2)
  - tmax(C)
  - tmin(C)
  - vp(Pa)
target_variables:
  - QObs(mm/d)
static_attributes:
  - elev_mean
  - slope_mean
  - area_gages2
  - frac_forest
  - lai_max
  - lai_diff
  - gvf_max
  - gvf_diff
  - soil_depth_pelletier
  - soil_depth_statsgo
  - soil_porosity
  - soil_conductivity
  - max_water_content
  - sand_frac
  - silt_frac
  - clay_frac
  - carbonate_rocks_frac
  - geol_permeability
  - p_mean
  - pet_mean
  - aridity
  - frac_snow
  - high_prec_freq
  - high_prec_dur
  - low_prec_freq
  - low_prec_dur

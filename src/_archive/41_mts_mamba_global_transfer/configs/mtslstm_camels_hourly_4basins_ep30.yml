# Baseline: MTS-LSTM with CAMELS-US hourly data (4 basins, 30 epochs)
# 阶段 0 收敛验证 — MTS-LSTM baseline
experiment_name: 41_mtslstm_camels_hourly_4basins_ep30

# --- Data ---
dataset: hourly_camels_us
data_dir: ./test/test_data/camels_us  # Phase 0 only; use real CAMELS-US path for Phase 1+
forcings: nldas_hourly

train_basin_file: ./test/test_data/4_basins_test_set.txt
validation_basin_file: ./test/test_data/4_basins_test_set.txt
test_basin_file: ./test/test_data/4_basins_test_set.txt

train_start_date: "01/01/2000"
train_end_date: "31/12/2000"
validation_start_date: "01/01/2001"
validation_end_date: "31/12/2001"
test_start_date: "01/01/2002"
test_end_date: "31/12/2002"

dynamic_inputs:
  - total_precipitation
  - temperature
target_variables:
  - qobs_mm_per_hour
static_attributes:
  - elev_mean
  - slope_mean

# --- Multi-timescale ---
use_frequencies:
  - 1D
  - 1h
seq_length:
  1D: 30
  1h: 336
predict_last_n:
  1D: 1
  1h: 24

# --- Model: MTS-LSTM ---
model: mtslstm
head: regression
output_activation: linear
hidden_size: 32
initial_forget_bias: 3
output_dropout: 0.4
transfer_mtslstm_states:
  h: linear
  c: linear
shared_mtslstm: false

# --- Training ---
epochs: 30
batch_size: 32
optimizer: Adam
loss: MSE
learning_rate:
  0: 1e-3
  15: 1e-4
clip_gradient_norm: 1

# --- Logging & Validation ---
validate_every: 5
validate_n_random_basins: 4
save_weights_every: 1
log_interval: 5
log_tensorboard: true
log_n_figures: 2
metrics:
  - NSE
  - KGE
  - Alpha-NSE
  - Beta-NSE

num_workers: 0
seed: 111
device: cpu
run_dir: results/41_mts_mamba_global_transfer

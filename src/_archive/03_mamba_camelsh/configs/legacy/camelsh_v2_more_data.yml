# CAMELSH Hourly LSTM - Version 2: More Training Data
# Improvements: Extended training period, longer sequence length
# Based on v1 (NSE=0.56, KGE=0.61)

experiment_name: camelsh_v2_more_data

# Dataset
dataset: generic
data_dir: data/camelsh

# Basin files
train_basin_file: data/camelsh/available_basins.txt
validation_basin_file: data/camelsh/available_basins.txt
test_basin_file: data/camelsh/available_basins.txt

# Time periods - Extended training from 5 years to 13 years
train_start_date: "01/01/2002"
train_end_date: "31/12/2014"
validation_start_date: "01/01/2015"
validation_end_date: "31/12/2017"
test_start_date: "01/01/2018"
test_end_date: "31/12/2020"

# Model configuration
model: cudalstm
head: regression
hidden_size: 128
initial_forget_bias: 3
output_dropout: 0.0
output_activation: linear

# Training configuration
epochs: 30
batch_size: 256
optimizer: AdamW
loss: NSE

# Learning rate schedule - smoother decay
learning_rate:
  0: 0.002
  10: 0.001
  20: 0.0005

# Dynamic inputs - NLDAS-2 hourly forcing
dynamic_inputs:
  - Rainf
  - Tair
  - SWdown
  - LWdown
  - Qair
  - PSurf
  - Wind_E
  - Wind_N
  - PotEvap

# Static attributes
static_attributes:
  - elev_mean
  - slope_mean
  - area
  - clay_frac
  - sand_frac
  - soil_porosity
  - permeability
  - frac_forest
  - p_mean
  - pet_mean
  - aridity
  - frac_snow
  - high_prec_freq

# Target
target_variables:
  - Streamflow

# Sequence length: 336 hours = 14 days (extended from 7 days)
seq_length: 336
predict_last_n: 1

# Training parameters
num_workers: 0
validate_every: 2
validate_n_random_basins: 50
clip_gradient_norm: 1.0

# Logging
log_interval: 50
log_tensorboard: true
log_n_figures: 3
save_weights_every: 5

# Metrics
metrics:
  - NSE
  - KGE

# Random seed
seed: 159193

# Device
device: cuda:0



# SCL-LSTM default experiment config for CAMELS-US

# --- SCL-specific ---
seg_length: 180
context_length: 30
overlap_length: 30
scl_weight: 0.1
enc_hidden_size: 64

# --- Standard NH-compatible ---
experiment_name: scl_lstm_default
hidden_size: 256
batch_size: 128
epochs: 30
learning_rate:
  0: 0.001
optimizer: adam
loss: nse
output_dropout: 0.4
clip_gradient_norm: 1.0

# Data
data_dir: /data/camels_us
train_basin_file: basins.txt
dynamic_inputs:
  - prcp(mm/day)
  - srad(W/m2)
  - tmax(C)
  - tmin(C)
  - vp(Pa)
target_variables:
  - QObs(mm/d)
static_attributes:
  - elev_mean
  - slope_mean
  - area_gages2
  - frac_forest
  - lai_max
  - lai_diff
  - gvf_max
  - gvf_diff
  - soil_depth_pelletier
  - soil_depth_statsgo
  - soil_porosity
  - soil_conductivity
  - max_water_content
  - sand_frac
  - silt_frac
  - clay_frac
  - carbonate_rocks_frac
  - geol_permeability
  - p_mean
  - pet_mean
  - aridity
  - frac_snow
  - high_prec_freq
  - high_prec_dur
  - low_prec_freq
  - low_prec_dur

# Periods
train_start_date: 01/10/1999
train_end_date: 30/09/2008
validation_start_date: 01/10/1980
validation_end_date: 30/09/1989
test_start_date: 01/10/1989
test_end_date: 30/09/1999

# Task 41 isolated config for Caravan daily pretraining on HPC
experiment_name: mts_mamba_caravan_daily

dataset: caravan
data_dir: /data1/home/${USER}/data/Caravan

# Basin split files
train_basin_file: /data1/home/${USER}/data/Caravan/all_basins.txt
validation_basin_file: /data1/home/${USER}/data/Caravan/all_basins.txt
test_basin_file: /data1/home/${USER}/data/Caravan/all_basins.txt

# Time periods
train_start_date: 01/01/1981
train_end_date: 31/12/2005
validation_start_date: 01/01/2006
validation_end_date: 31/12/2010
test_start_date: 01/01/2011
test_end_date: 31/12/2020

model: cudalstm
head: regression
hidden_size: 128
initial_forget_bias: 3
output_dropout: 0.4

epochs: 30
batch_size: 256
optimizer: AdamW
learning_rate:
  0: 0.001
  10: 0.0005
  20: 0.0001
loss: NSE

num_workers: 8
cache_validation_data: false
validate_every: 2
validate_n_random_basins: 100
save_weights_every: 5
log_interval: 50

forcings:
  - caravan

dynamic_inputs:
  - total_precipitation_sum
  - surface_net_solar_radiation_mean
  - temperature_2m_max
  - temperature_2m_min
  - dewpoint_temperature_2m_mean

static_attributes:
  - ele_mt_sav
  - slp_dg_sav
  - area
  - sgr_dk_sav
  - snd_pc_sav
  - cly_pc_sav
  - slt_pc_sav
  - for_pc_sse
  - p_mean
  - aridity_ERA5_LAND
  - frac_snow
  - high_prec_freq

target_variables:
  - streamflow

seq_length: 365
predict_last_n: 1

run_dir: results/41_mts_mamba_global_transfer
log_tensorboard: true
log_n_figures: 3

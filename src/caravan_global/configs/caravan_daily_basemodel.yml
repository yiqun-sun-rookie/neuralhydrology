# Caravan Global Daily Model Configuration
# Based on CAMELS-US configuration but adapted for global scale
# Dataset: Caravan (7130 basins)

experiment_name: caravan_global_daily_v1

# Dataset configuration
dataset: caravan
data_dir: data/Caravan

# Basin files
train_basin_file: data/Caravan/all_basins.txt
validation_basin_file: data/Caravan/all_basins.txt
test_basin_file: data/Caravan/all_basins.txt

# Time periods
train_start_date: 01/01/1981
train_end_date: 31/12/2005
validation_start_date: 01/01/2006
validation_end_date: 31/12/2010
test_start_date: 01/01/2011
test_end_date: 31/12/2020

# Model configuration
model: cudalstm
head: regression
hidden_size: 128  # Matched to CAMELS-US model for weight transfer
initial_forget_bias: 3
output_dropout: 0.4

# Training configuration
epochs: 30
batch_size: 256
optimizer: AdamW
learning_rate:
  0: 0.001
  10: 0.0005
  20: 0.0001
loss: NSE

# Input features (ERA5-Land from Caravan)
forcings:
  - caravan

dynamic_inputs:
  - total_precipitation_sum
  - surface_net_solar_radiation_mean
  - temperature_2m_max
  - temperature_2m_min
  - dewpoint_temperature_2m_mean

static_attributes:
  - ele_mt_sav          # elev_mean
  - slp_dg_sav          # slope_mean
  - area                # area_gages2
  - sgr_dk_sav          # soil_depth_pelletier (proxy)
  - snd_pc_sav          # sand_frac
  - cly_pc_sav          # clay_frac
  - slt_pc_sav          # (extra soil info)
  - for_pc_sse          # frac_forest
  - p_mean              # p_mean
  - aridity_ERA5_LAND   # aridity
  - frac_snow           # frac_snow
  - high_prec_freq      # high_prec_freq

target_variables:
  - streamflow

checkpoint_path: runs/reproduce_531_nse074_2025_1129_2145_ep30/caravan_pretrained_weights.pt

seq_length: 365

predict_last_n: 1

batch_size: 256
clip_gradient_norm: 1.0
data_dir: data\camels_us
dataset: camels_us
device: cuda:0
dynamic_inputs:
- PRCP(mm/day)
- Tmin(C)
- Tmax(C)
- SRAD(W/m2)
- Vp(Pa)
epochs: 30
experiment_name: hde_transformer_s300
forcings:
- maurer
head: regression
hidden_size: 256
initial_forget_bias: 5
learning_rate:
  0: 0.001
  11: 0.0005
  21: 0.0001
log_n_figures: 0
log_tensorboard: false
loss: NSE
metrics:
- NSE
model: transformer
num_workers: 4
number_of_basins: 531
optimizer: Adam
output_activation: linear
output_dropout: 0.4
package_version: 1.12.0
predict_last_n: 1
run_dir: results/19_hetero_deep_ensemble
save_weights_every: 10
seed: 300
seq_length: 270
static_attributes:
- p_mean
- pet_mean
- aridity
- p_seasonality
- frac_snow
- high_prec_freq
- high_prec_dur
- low_prec_freq
- low_prec_dur
- elev_mean
- slope_mean
- area_gages2
- frac_forest
- lai_max
- lai_diff
- gvf_max
- gvf_diff
- soil_depth_pelletier
- soil_depth_statsgo
- soil_porosity
- soil_conductivity
- max_water_content
- sand_frac
- silt_frac
- clay_frac
- carbonate_rocks_frac
- geol_permeability
target_variables:
- QObs(mm/d)
test_basin_file: src/fair_benchmark/frozen/track0_forcing_only_basins.txt
test_end_date: 30/09/1999
test_start_date: 01/10/1989
train_basin_file: src/fair_benchmark/frozen/track0_forcing_only_basins.txt
train_end_date: 30/09/2008
train_start_date: 01/10/1999
validation_basin_file: src/fair_benchmark/frozen/track0_forcing_only_basins.txt
dynamics_embedding:
  type: fc
  hiddens:
  - 32
  activation: tanh
  dropout: 0.0
statics_embedding:
  type: fc
  hiddens:
  - 32
  activation: tanh
  dropout: 0.0
transformer_nheads: 4
transformer_nlayers: 2
transformer_dim_feedforward: 256
transformer_dropout: 0.1
transformer_positional_dropout: 0.1
transformer_positional_encoding_type: sum

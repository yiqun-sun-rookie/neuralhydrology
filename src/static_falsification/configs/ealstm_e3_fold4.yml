experiment_name: sf_e3_fold4
dataset: camels_us
data_dir: data/CAMELS_US
model: ealstm
head: regression
hidden_size: 256
initial_forget_bias: 3
output_dropout: 0.0
output_activation: linear
epochs: 30
batch_size: 256
optimizer: Adam
loss: NSE
learning_rate:
  0: 0.001
train_basin_file: src\static_falsification\data\fold4_train.txt
validation_basin_file: src\static_falsification\data\fold4_validation.txt
test_basin_file: src\static_falsification\data\fold4_test.txt
train_start_date: 01/10/1999
train_end_date: 30/09/2008
validation_start_date: 01/10/1980
validation_end_date: 30/09/1989
test_start_date: 01/10/1989
test_end_date: 30/09/1999
forcings:
- daymet
dynamic_inputs:
- prcp(mm/day)
- srad(W/m2)
- tmax(C)
- tmin(C)
- vp(Pa)
static_attributes:
- elev_mean
- slope_mean
- area_gages2
- soil_depth_pelletier
- soil_depth_statsgo
- soil_porosity
- soil_conductivity
- max_water_content
- sand_frac
- silt_frac
- clay_frac
- carbonate_rocks_frac
- geol_permeability
- frac_forest
- lai_max
- lai_diff
- gvf_max
- gvf_diff
- dom_land_cover_frac
- p_mean
- pet_mean
- aridity
- frac_snow
- high_prec_freq
target_variables:
- QObs(mm/d)
clip_targets_to_zero:
- QObs(mm/d)
seq_length: 365
predict_last_n: 1
num_workers: 0
validate_every: 2
validate_n_random_basins: 50
clip_gradient_norm: 1.0
log_interval: 10
log_tensorboard: false
log_n_figures: 0
save_weights_every: 10
metrics:
- NSE
- KGE

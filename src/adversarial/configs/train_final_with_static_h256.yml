# Final model: hidden_size=256, Kratzert 2019 standard split
experiment_name: adv_final_with_static_h256
dataset: camels_us
data_dir: data/camels_us/full
model: cudalstm
head: regression
hidden_size: 256
initial_forget_bias: 3
output_dropout: 0.0
output_activation: linear

optimizer: AdamW
loss: NSE
learning_rate:
  0: 0.003
  10: 0.001
  20: 0.0005
batch_size: 256
epochs: 30
clip_gradient_norm: 1.0
predict_last_n: 1
seq_length: 365
seed: 159193
num_workers: 0
device: cuda:0

train_basin_file: examples/06-Finetuning/531_basin_list.txt
validation_basin_file: examples/06-Finetuning/531_basin_list.txt
test_basin_file: examples/06-Finetuning/531_basin_list.txt

# Kratzert 2019 HESS standard split
train_start_date: '01/10/1999'
train_end_date: '30/09/2008'
validation_start_date: '01/10/1980'
validation_end_date: '30/09/1989'
test_start_date: '01/10/1989'
test_end_date: '30/09/1999'

validate_every: 2
validate_n_random_basins: 50
save_weights_every: 5
log_interval: 10
log_tensorboard: false
log_n_figures: 0

forcings:
  - daymet

dynamic_inputs:
  - prcp(mm/day)
  - srad(W/m2)
  - tmax(C)
  - tmin(C)
  - vp(Pa)

target_variables:
  - QObs(mm/d)

clip_targets_to_zero:
  - QObs(mm/d)

static_attributes:
  - elev_mean
  - slope_mean
  - area_gages2
  - frac_forest
  - lai_max
  - lai_diff
  - gvf_max
  - gvf_diff
  - soil_depth_pelletier
  - soil_depth_statsgo
  - soil_porosity
  - soil_conductivity
  - max_water_content
  - sand_frac
  - silt_frac
  - clay_frac
  - carbonate_rocks_frac
  - geol_permeability
  - p_mean
  - pet_mean
  - aridity
  - frac_snow
  - high_prec_freq
  - high_prec_dur
  - low_prec_freq
  - low_prec_dur

metrics:
  - NSE

experiment_name: adv_531_no_static
dataset: camels_us
data_dir: data/camels_us
model: cudalstm
head: regression
hidden_size: 128
initial_forget_bias: 3
output_dropout: 0.4
output_activation: linear

optimizer: Adam
loss: NSE
learning_rate:
  0: 1e-3
  1: 5e-4
batch_size: 256
epochs: 30
clip_gradient_norm: 1
predict_last_n: 1
seq_length: 365
seed: 123
num_workers: 0
device: cuda:0

train_basin_file: examples/06-Finetuning/531_basin_list.txt
validation_basin_file: examples/06-Finetuning/531_basin_list.txt
test_basin_file: examples/06-Finetuning/531_basin_list.txt

train_start_date: '01/10/1999'
train_end_date: '30/09/2008'
validation_start_date: '01/10/1980'
validation_end_date: '30/09/1989'
test_start_date: '01/10/1989'
test_end_date: '30/09/1999'

validate_every: 2
validate_n_random_basins: 531
save_weights_every: 5
log_interval: 5
log_tensorboard: false
log_n_figures: 0

forcings:
  - daymet

dynamic_inputs:
  - prcp(mm/day)
  - srad(W/m2)
  - tmax(C)
  - tmin(C)
  - vp(Pa)

target_variables:
  - QObs(mm/d)

clip_targets_to_zero:
  - QObs(mm/d)

# NO static_attributes — ablation control

metrics:
  - NSE

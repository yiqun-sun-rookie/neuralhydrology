model:
  run_dir: "results/05_adversarial_robustness/full_training_nse_2025_1025_1821_ep50"
  device: "cpu"

data:
  data_dir: "data/CAMELS_US"
  period: "test"
  # 15 basins sampled from the 67 test basins (diverse HUC regions)
  basins:
    - "01055000"   # HUC-01 New England
    - "01544500"   # HUC-01
    - "02198100"   # HUC-02 Mid-Atlantic
    - "02372250"   # HUC-03 Southeast
    - "03281500"   # HUC-03
    - "04059500"   # HUC-04 Great Lakes
    - "05495000"   # HUC-05 Ohio
    - "06311000"   # HUC-06 Missouri
    - "07375000"   # HUC-07 Lower Mississippi
    - "08101000"   # HUC-08 Texas-Gulf
    - "09430500"   # HUC-09 Colorado
    - "10023000"   # HUC-10 Great Basin
    - "11124500"   # HUC-11 Pacific (CA)
    - "12054000"   # HUC-12 Pacific Northwest
    - "13310700"   # HUC-13 Snake/Columbia

attacks:
  auto_pgd:
    n_iter: 50
    n_restarts: 1
  cw_regression:
    n_iter: 200
    target_nse: 0.0
    lr: 0.01
    binary_search_steps: 5
  sparse_temporal:
    max_steps_fraction: 0.05  # 5% of timesteps
    n_iter: 100
  causal_trigger:
    pre_windows: [1, 3, 7, 14]
    n_iter: 100
  spectral:
    freq_bands: ["all", "low", "mid", "high"]
    n_iter: 100
  uap:
    n_iter: 50

epsilons: [0.01, 0.02, 0.05, 0.1, 0.2, 0.5]
constraint_levels: ["lp", "physical", "statistical"]
targets: ["untargeted", "flood", "lowflow"]

output_dir: "results/adversarial_eval"

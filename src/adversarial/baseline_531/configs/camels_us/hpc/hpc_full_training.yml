# HPC优化配置 - 完整流域训练
# 针对河海大学HPC平台优化
# 生成时间: 2025-01-XX
# 配置版本: v1.0

# =============================================================================
# 基础设置
# =============================================================================
experiment_name: hpc_full_531_basins_optimized
dataset: camels_us
# HPC数据路径 - 需要根据实际HPC环境调整
data_dir: /data/neuralhydrology/CAMELS_US

# =============================================================================
# 模型配置 - HPC优化
# =============================================================================
model: cudalstm
head: regression
hidden_size: 512                    # 从128提升到512，充分利用HPC资源
initial_forget_bias: 3
output_dropout: 0.2                 # 适中的dropout防止过拟合
output_activation: linear

# =============================================================================
# 训练配置 - HPC优化
# =============================================================================
epochs: 200                         # 从50提升到200，充分利用HPC长时间运行
batch_size: 512                     # 从256提升到512，充分利用GPU内存
optimizer: AdamW
loss: NSE

# =============================================================================
# 学习率调度 - 更细粒度的调度策略
# =============================================================================
learning_rate:
  0: 0.001                          # 初始学习率
  50: 0.0008                        # 50个epoch后
  100: 0.0005                       # 100个epoch后
  150: 0.0003                       # 150个epoch后
  180: 0.0001                       # 180个epoch后

# =============================================================================
# 数据配置 - 使用531个基准流域
# =============================================================================
train_basin_file: src/full_531_basins/configs/camels_us/data_splits/531_basins_train_basins.txt
validation_basin_file: src/full_531_basins/configs/camels_us/data_splits/531_basins_val_basins.txt
test_basin_file: src/full_531_basins/configs/camels_us/data_splits/531_basins_test_basins.txt

# 时间范围 - 保持原有的时间分割策略
train_start_date: 01/10/1980
train_end_date: 30/09/1999
validation_start_date: 01/10/2000
validation_end_date: 30/09/2007
test_start_date: 01/10/2008
test_end_date: 30/09/2014

# =============================================================================
# 输入特征配置
# =============================================================================
forcings:
  - daymet

dynamic_inputs:
  - prcp(mm/day)
  - srad(W/m2)
  - tmax(C)
  - tmin(C)
  - vp(Pa)

# 目标变量
target_variables:
  - QObs(mm/d)

# 数据预处理
clip_targets_to_zero:
  - QObs(mm/d)

# =============================================================================
# 训练参数 - HPC优化
# =============================================================================
seq_length: 365
predict_last_n: 1
num_workers: 16                     # HPC多核优势，从0提升到16
validate_every: 10                  # 减少验证频率，从5提升到10
validate_n_random_basins: 50        # 保持验证流域数量

# =============================================================================
# 正则化配置
# =============================================================================
clip_gradient_norm: 1.0

# =============================================================================
# 日志和保存配置 - HPC优化
# =============================================================================
log_interval: 10                    # 日志间隔，从5提升到10
log_tensorboard: true
log_n_figures: 5
save_weights_every: 20              # 减少保存频率，从10提升到20

# 增加控制台输出信息
verbose: 1

# =============================================================================
# 评估指标
# =============================================================================
metrics:
  - NSE
  - KGE
  - Alpha-NSE
  - RMSE
  - MAE

# =============================================================================
# 随机种子
# =============================================================================
seed: 159193

# =============================================================================
# HPC特定优化配置
# =============================================================================
# 混合精度训练 - 减少内存使用，提升训练速度
use_mixed_precision: true

# 内存优化
pin_memory: true                    # 固定内存，提升数据传输速度
persistent_workers: true            # 持久化workers，减少进程创建开销
prefetch_factor: 4                  # 数据预取因子

# 梯度累积 - 支持更大有效批次
gradient_accumulation_steps: 1      # 可根据需要调整

# 多GPU训练配置
use_data_parallel: true             # 启用数据并行
gpu_ids: [0, 1]                     # 使用GPU 0和1，根据HPC分配调整

# 检查点配置
save_best_model: true               # 保存最佳模型
early_stopping_patience: 30         # 早停耐心值

# 性能监控
profile_training: false             # 训练性能分析（调试时启用）
monitor_gpu_memory: true            # 监控GPU内存使用

# =============================================================================
# 数据加载优化
# =============================================================================
# 数据缓存配置
cache_dataset: false                # 是否缓存数据集（需要足够内存）
cache_size: 1000                    # 缓存大小

# 数据预处理优化
preprocess_workers: 4               # 预处理工作进程数
data_loading_timeout: 300           # 数据加载超时时间（秒）

# =============================================================================
# 错误处理和恢复
# =============================================================================
# 自动恢复配置
auto_resume: true                   # 自动恢复训练
resume_from_latest: true            # 从最新检查点恢复
max_retries: 3                      # 最大重试次数

# 检查点配置
checkpoint_interval: 10             # 检查点保存间隔
keep_checkpoints: 5                 # 保留的检查点数量

# =============================================================================
# 实验跟踪配置
# =============================================================================
# 实验记录
experiment_tracking: true
track_hyperparameters: true
track_metrics: true
track_artifacts: true

# 输出目录配置
output_dir: /data/neuralhydrology/runs
log_dir: /data/neuralhydrology/logs
checkpoint_dir: /data/neuralhydrology/checkpoints

# =============================================================================
# 注释和说明
# =============================================================================
# 此配置文件针对河海大学HPC平台进行了以下优化：
# 1. 模型容量提升：隐藏层从128扩展到512
# 2. 训练规模扩展：从50个epoch扩展到200个epoch
# 3. 批次大小优化：从256提升到512，充分利用GPU内存
# 4. 并行处理优化：启用16个数据加载工作进程
# 5. 性能优化：启用混合精度训练、内存固定、数据预取
# 6. 多GPU支持：配置数据并行训练
# 7. 错误恢复：自动断点续训和错误处理
# 8. 监控配置：GPU内存监控和性能分析
#
# 使用前请确保：
# - HPC环境已正确配置CUDA和PyTorch
# - 数据路径已正确设置
# - GPU资源已正确分配
# - 输出目录有足够存储空间



